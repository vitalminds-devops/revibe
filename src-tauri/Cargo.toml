[package]
name = "revibe"
version = "0.1.0"
description = "Screenshots of technician reports into accomplishment reports"
authors = ["John Daniel Cruz"]
license = ""
repository = ""
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "revibe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = { version = "1.0", features = ["preserve_order"] }
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.5", features = ["protocol-asset"] }
rusqlite = { version = "0.42.0", features = ["bundled"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
ocrs = "0.14.0"
candle-core = { version = "0.11.1", default-features = false }
candle-nn = { version = "0.11.1", default-features = false }
candle-transformers = { version = "0.11.1", default-features = false }
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"] }
rust_xlsxwriter = "0.102.0"
uuid = { version = "1.29.2", features = ["v4"] }
rten = "0.28"
anyhow = "1.0.104"
thiserror = "2"
regex = "1.13.1"
