# ReVibe: `docker compose up -d --build`. Settings come from .env next to this file (one file for everything).
# Postgres and R2 are external (DATABASE_URL, R2_*). nginx runs on a separate server and proxies
# to the published web port (WEB_PORT); the backend (BACKEND_PORT) is only reachable inside this
# compose network. The AI models are baked into the backend image.

x-env: &env
  env_file: .env
  restart: unless-stopped

services:
  # One-off: applies Prisma migrations, then exits. backend and web wait for it.
  migrate:
    <<: *env
    build:
      context: ./frontend
      args:
        # Baked into the website's /api rewrite: rebuild after changing BACKEND_PORT.
        API_URL: http://backend:${BACKEND_PORT:-3000}
    image: revibe-web
    command: ["npm", "run", "db:migrate"]
    restart: "no"

  backend:
    <<: *env
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: revibe-backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${BACKEND_PORT:-8000}/folders', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3

  web:
    <<: *env
    image: revibe-web
    init: true
    ports:
      # Reachable by the nginx server. Restrict with a firewall, or bind to a private IP,
      # e.g. "10.0.0.5:3000:3000".
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/login').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
